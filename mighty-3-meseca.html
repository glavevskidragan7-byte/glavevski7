<style>
:root{--bg:#070b14;--card:#111827;--card2:#1a2233;--line:#263045;--txt:#f1f5f9;--mut:#94a3b8;--lime:#a3e635;--red:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{text-align:center;padding:22px 16px 6px}
h1{margin:0;font-size:28px;letter-spacing:2px;font-weight:900}
.sub{color:var(--lime);font-weight:800;letter-spacing:4px}
h2{margin:0 0 8px;font-size:20px}
main{max-width:560px;margin:0 auto;padding:8px 12px 40px}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:10px;margin-top:12px}
.center{text-align:center;flex:1;min-width:0}
.muted{color:var(--mut);font-size:15px}.lime{color:var(--lime)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:800;background:var(--lime);color:#0b1200;cursor:pointer}
.btn.ghost{background:var(--card2);color:var(--txt)}
.btn.danger{background:transparent;color:var(--red);border:2px solid var(--red);margin-top:14px}
.btn.big{font-size:20px;padding:18px;margin-top:12px}
.btn:active{transform:scale(.98)}
.nav{width:46px;height:46px;border-radius:50%;border:0;background:var(--card2);color:var(--txt);font-size:28px;flex:none}
.bar{height:14px;background:var(--card2);border-radius:9px;overflow:hidden}
#barFill{height:100%;width:0;background:var(--lime);transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.stats b{display:block;font-size:24px;color:var(--lime)}.stats span{font-size:13px;color:var(--mut)}
.ex{background:var(--card2);border-radius:16px;padding:12px;margin-top:10px}
.ex.ok{outline:2px solid var(--lime)}
.exHead{display:flex;gap:10px;align-items:center}
.exHead .nm{flex:1;min-width:0;font-weight:700}
.exHead .nm small{display:block;color:var(--mut);font-weight:400}
.chk{width:44px;height:44px;flex:none;border-radius:12px;border:2px solid var(--mut);background:transparent;color:#0b1200;font-size:26px;font-weight:900}
.chk.on{background:var(--lime);border-color:var(--lime)}
.ex svg{width:100%;max-width:220px;height:auto;display:block;margin:8px auto;background:#0d1320;border-radius:12px}
.tip{color:var(--mut);font-size:15px;margin:4px 0 0}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.set{min-width:44px;height:40px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--txt);font-weight:700;padding:0 10px}
.set.on{background:var(--lime);border-color:var(--lime);color:#0b1200}
.tag{display:inline-block;font-size:12px;background:#334155;color:var(--txt);border-radius:6px;padding:1px 7px;margin-left:4px;vertical-align:middle}
.timer{margin-top:10px;text-align:center}
.timer .t{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums}
.timer .row{gap:8px}.timer .btn{padding:12px;font-size:16px}
.note{background:#1e293b;border-left:4px solid var(--lime);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.legend{font-size:13px;color:var(--mut);margin-bottom:8px}
.lg{display:inline-block;width:12px;height:12px;border-radius:4px;margin:0 4px 0 8px;vertical-align:-1px}
.lg.done{background:var(--lime)}.lg.part{border:2px solid var(--lime)}.lg.rest{background:#334155}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:12px;color:var(--mut)}
.cal .mon{grid-column:1/-1;font-weight:800;color:var(--lime);margin-top:6px;font-size:14px}
.d{aspect-ratio:1;border:0;border-radius:10px;background:var(--card2);color:var(--txt);font-weight:700;font-size:15px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.d small{font-size:9px;color:var(--mut);font-weight:600}
.d.rest{background:#1e293b;color:var(--mut)}
.d.part{box-shadow:inset 0 0 0 2px var(--lime)}
.d.done{background:var(--lime);color:#0b1200}.d.done small{color:#0b1200}
.d.today{text-decoration:underline;text-underline-offset:3px}
.d.sel{outline:3px solid #fff}
input[type=date]{width:100%;margin:6px 0 4px;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:17px;color-scheme:dark}
@media (max-width:360px){body{font-size:16px}h1{font-size:24px}.card{padding:12px}.d{font-size:13px}.d small{display:none}.timer .t{font-size:38px}}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:10px 4px;border-radius:12px;border:0;background:var(--card2);color:var(--txt);font-weight:700;font-size:15px}.tabs button.on{background:var(--lime);color:#0b1200}
.lvl{display:inline-block;background:var(--lime);color:#0b1200;border-radius:8px;padding:1px 8px;font-size:13px;font-weight:800;margin-left:6px}
.reps{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:10px;font-size:15px}.reps .muted{flex-basis:100%}
.reps input{width:70px;margin-left:6px;padding:8px;border-radius:10px;border:1px solid var(--line);background:#0d1320;color:var(--txt);font-size:17px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>MIGHTY PROJECT</h1>
  <div class="sub" id="subTitle">3 MESECA</div>
</header>

<main>
  <section class="card" id="today"></section>

  <section class="card">
    <div class="row between"><h2 id="progTitle">Napredak</h2><strong id="pct" class="lime">0%</strong></div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="stats">
      <div><b id="stEx">0</b><span>urađenih vežbi</span></div>
      <div><b id="stDays">0</b><span>završenih dana</span></div>
      <div><b id="stStreak">0</b><span>niz dana</span></div>
    </div>
  </section>

  <section class="card" id="daySec">
    <div class="row between">
      <button class="nav" id="prevDay" aria-label="Prethodni dan">‹</button>
      <div class="center"><div id="dayDate" class="muted"></div><h2 id="dayTitle"></h2></div>
      <button class="nav" id="nextDay" aria-label="Sledeći dan">›</button>
    </div>
    <div id="dayNote"></div>
    <div id="exList"></div>
    <div class="row gap">
      <button class="btn" id="markDay">Označi dan završenim</button>
      <button class="btn ghost" id="resetDay">Poništi dan</button>
    </div>
  </section>

  <section class="card">
    <h2>Kalendar (90 dana)</h2>
    <div class="tabs" id="tabs"></div>
    <div class="legend"><span class="lg done"></span>završeno <span class="lg part"></span>započeto <span class="lg rest"></span>odmor</div>
    <div class="cal" id="cal"></div>
  </section>

  <section class="card">
    <h2>Podešavanja</h2>
    <label class="muted" for="startDate">Početak izazova</label>
    <input type="date" id="startDate">
    <button class="btn danger" id="resetAll">Obriši sav napredak</button>
  </section>
</main>

  const p = (PICS[key] || '').split('|').map(s => {
    const k = s[0], n = s.slice(1).trim();
    if (k === 'f') return '<line x1="4" y1="64" x2="96" y2="64" stroke="#334155" stroke-width="2"/>';
    if (k === 'h') { const [x, y] = n.split(' '); return `<circle cx="${x}" cy="${y}" r="5" fill="#f1f5f9"/>`; }
    if (k === 'r') { const [x, y, w, h] = n.split(' '); return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#64748b"/>`; }
    const pts = n.match(/-?\d+ -?\d+/g).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${k === 'g' ? '#a3e635' : '#f1f5f9'}" stroke-width="${k === 'g' ? 2 : 3}" stroke-linecap="round" stroke-linejoin="round"${k === 'g' ? ' stroke-dasharray="3 3"' : ''}/>`;
  }).join('');
  return `<svg viewBox="0 0 100 70" aria-hidden="true">${p}</svg>`;
}

// ===== Plan za rast: gornji/donji deo 4× nedeljno, supersetovi, 3 serije (poslednja do otkaza) + džak 2× 15 min =====
// l = oznaka (A1/A2 = superset), n = naziv za mesec 1/2/3, c = cilj ponavljanja, nf = NE do otkaza
const ex = (l, n, p, c, t, nf) => ({ l, n, p, c, t, nf, sets: 2 });
const DZAK = {
  l: 'Džak', n: ['Boks džak', 'Boks džak', 'Boks džak'], p: 'dzak', min: 15, sets: 1,
  tm: [
    '5 rundi po 3 minuta, kratka pauza između. Gard gore, brada dole, kretanje oko džaka, kombinacije 1-2, 1-2-3.',
    '5 rundi po 3 minuta. U poslednjih 30 sekundi svake runde maksimalan tempo. Dodaj krošee i aperkate u telo.',
    '15 minuta bez stajanja – 30 s eksplozivno, 30 s lakše (kretanje i džeb). Diši pri svakom udarcu.'
  ]
};
const SP = ', 3 s spuštanje';
const RANAC = ' Kad pređeš gornji broj u obe serije, stavi ranac sa težinom.';
const REST = { title: 'Odmor', rest: 1, note: 'Dan odmora 😴 – ovo nije propušten trening. Spavaj, jedi proteine i pij vodu.', ex: [{ l: '', n: ['Odmor', 'Odmor', 'Odmor'], p: 'odmor', sets: 1, t: 'Bez treninga. Mišići rastu dok se odmaraš.' }] };
const PLAN = {
  1: { title: 'Gornji deo A', ex: [
    ex('A1', ['Zgibovi', 'Zgibovi sa pauzom 1 s gore', 'Zgibovi sa rancem'], 'zgib', '6–10', 'Hvat malo širi od ramena, povuci grudi ka šipki, spuštaj se do pune ekstenzije.' + RANAC),
    ex('A2', ['Sklekovi sa nogama na stolici', 'Sklekovi sa nogama na stolici' + SP, 'Sklekovi sa nogama na stolici i rancem'], 'decline', '8–15', 'Stopala na stolici, šake na podu, telo pravo. Radi gornji deo grudi i ramena.' + RANAC),
    ex('B1', ['Obrnuto razvlačenje u pretklonu', 'Obrnuto razvlačenje, 1 s pauza gore', 'Obrnuto razvlačenje' + SP], 'reverse', '15–25', 'Pretklon skoro do paralele sa podom, leđa ravna, ruke blago savijene. Podiži bučice u stranu i stisni lopatice – zadnja ramena i gornja leđa. Lake bučice su ovde taman.'),
    ex('B2', ['Pike sklekovi', 'Pike sklekovi sa nogama na stolici', 'Pike sklekovi sa nogama na stolici' + SP], 'pike', '6–12', 'Kukovi visoko (obrnuto V), spuštaj glavu ka podu ispred šaka pa se odgurni. Radi ramena.'),
    ex('C', ['Lateralno podizanje bučica', 'Lateralno podizanje' + SP, 'Lateralno podizanje + delimična ponavljanja na kraju'], 'lateral', '15–25', 'Blago savijeni laktovi, podiži u stranu do visine ramena, bez zamaha.')
  ] },
  3: { title: 'Donji deo A + džak', ex: [
    ex('A1', ['Bugarski čučanj sa bučicama', 'Bugarski čučanj sa bučicama' + SP, 'Bugarski čučanj sa bučicama i rancem'], 'bugarski', '8–15 po nozi', 'Zadnja noga na stolici. Spuštaj se pravo dole dok prednja butina ne bude paralelna sa podom. Jedna serija = obe noge.'),
    ex('A2', ['Podizanje kolena u visu', 'Podizanje ispruženih nogu u visu', 'Podizanje ispruženih nogu do šipke'], 'visenje', '8–15', 'Vis na šipci, bez ljuljanja. Podigni noge polako i polako ih spusti.'),
    ex('B', ['Podizanje na prste jedne noge', 'Podizanje na prste jedne noge sa bučicom', 'Podizanje na prste jedne noge sa bučicom, 2 s gore'], 'prsti', '15–20 po nozi', 'Podigni se što više, zadrži gore, polako spusti. Drži se za zid zbog ravnoteže.'),
    ex('C', ['Skokovi iz čučnja', 'Skokovi iz čučnja sa pauzom dole', 'Skokovi iz dubokog čučnja'], 'skok', '6', 'Eksplozivno gore, meko doskoči sa savijenim kolenima. NE DO OTKAZA – svaki skok maksimalno brz.', 1),
    DZAK
  ] },
  2: REST,
  5: { title: 'Gornji deo B', ex: [
    ex('A1', ['Zgibovi obrnutim hvatom', 'Zgibovi obrnutim hvatom' + SP, 'Zgibovi obrnutim hvatom sa rancem'], 'chin', '6–10', 'Dlanovi ka tebi, u širini ramena. Povuci bradu iznad šipke – radi leđa i biceps.' + RANAC),
    ex('A2', ['Propadanja na stolici, kolena savijena', 'Propadanja na stolici, ispružene noge', 'Propadanja na stolici, noge na drugoj stolici'], 'dipstolica', '10–20', 'Leđima ka stolici, šake na ivici stolice, prsti napred. Spuštaj se dok laktovi ne budu pod 90°, laktovi idu unazad, ne u stranu. Radi triceps.'),
    ex('B1', ['Široki zgibovi', 'Široki zgibovi sa pauzom gore', 'Široki zgibovi, 4 s spuštanje'], 'zgib', '5–10', 'Hvat dosta širi od ramena, vodi laktovima nadole – širi leđa.'),
    ex('B2', ['Široki sklekovi', 'Široki sklekovi' + SP, 'Streličarski (arčer) sklekovi'], 'sirokisk', '8–20', 'Šake šire od ramena, spuštaj se dok grudi skoro ne dodirnu pod. Kod arčer sklekova telo ide ka jednoj ruci, druga je ispružena u stranu.'),
    ex('C1', ['Pregib za biceps', 'Pregib za biceps' + SP, 'Pregib za biceps, 1 s pauza gore' + SP], 'biceps', '12–20', 'Laktovi uz telo, bez ljuljanja, spuštaj polako do kraja.'),
    ex('C2', ['Triceps pregib ležeći (francuski potisak)', 'Triceps pregib ležeći' + SP, 'Triceps pregib ležeći, 1 s pauza dole' + SP], 'francuski', '12–20', 'Lezi na leđa, bučice iznad grudi. Savij samo laktove i spusti bučice pored glave, pa ispruži ruke. Nadlaktice se ne pomeraju.')
  ] },
  0: { title: 'Donji deo B + džak', ex: [
    ex('A1', ['Čučanj sa rancem', 'Goblet čučanj sa rancem na leđima', 'Čučanj 1½ sa rancem (dole – pola gore – dole – gore)'], 'cucanj', '15–25', 'Stopala u širini ramena, kukovi unazad, kolena prate prste, pete na podu.' + RANAC),
    ex('A2', ['Bočni plank', 'Bočni plank sa podizanjem gornje noge', 'Bočni plank sa spuštanjem i podizanjem kuka'], 'sideplank', '30–60 s po strani', 'Lakat ispod ramena, telo u pravoj liniji. Jedna serija = obe strane.'),
    ex('B1', ['Penjanje na stolicu sa bučicama', 'Penjanje na stolicu sa bučicama, polako dole', 'Penjanje na stolicu sa bučicama i rancem'], 'stepup', '10–15 po nozi', 'Cela stopa na stolici, gurni se gore preko pete, ne odbijaj se zadnjom nogom.'),
    ex('B2', ['Sedanje na stolicu na jednoj nozi', 'Sedanje na stolicu na jednoj nozi' + SP, 'Sedanje na stolicu na jednoj nozi sa bučicom'], 'cucanj1', '6–12 po nozi', 'Stani ispred stolice na jednoj nozi, polako sedni i ustani bez pomoći druge noge.'),
    ex('C', ['Podizanje na prste obe noge sa rancem', 'Podizanje na prste sa rancem, 2 s gore', 'Podizanje na prste jedne noge sa rancem'], 'prsti', '15–25', 'Podigni se što više, zadrži gore, polako spusti.'),
    DZAK
  ] },
  4: REST,
  6: REST
};
const DAY_NOTE = 'Zagrevanje 2–3 min. Vežbe sa istim slovom rade se u paru (superset): A1 pa odmah A2 (isto B1+B2, C1+C2), odmor 60–90 s, ponovi još jednom. Prvu seriju završi sa 1–2 ponavljanja u rezervi, drugu idi do otkaza. Upiši koliko si uradio – sledeće nedelje pokušaj više.';
const DANI = ['Nedelja', 'Ponedeljak', 'Utorak', 'Sreda', 'Četvrtak', 'Petak', 'Subota'];
const MESECI = ['januar', 'februar', 'mart', 'april', 'maj', 'jun', 'jul', 'avgust', 'septembar', 'oktobar', 'novembar', 'decembar'];
const NDAYS = 90;

// ===== Datumi =====
const pad = n => String(n).padStart(2, '0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parse(k); return key(new Date(d.getFullYear(), d.getMonth(), d.getDate() + n)); };
const todayKey = () => key(new Date());
const nice = k => { const d = parse(k); return `${DANI[d.getDay()]}, ${d.getDate()}. ${MESECI[d.getMonth()]}`; };
const planOf = k => {
  const P = PLAN[parse(k).getDay()];
  if (!P.v) return P;
  // Isti dan u nedelji smenjuje trening A i B
  return { title: P.title, ex: P.v[Math.floor(Math.max(0, days().indexOf(k)) / 7) % 2], ab: Math.floor(Math.max(0, days().indexOf(k)) / 7) % 2 };
};

// ===== Stanje (localStorage) =====
const LS = 'mighty-3meseca-v4';
let S;
try { S = JSON.parse(localStorage.getItem(LS)); } catch (e) { S = null; }
if (!S || !S.start) { let old = null; try { old = JSON.parse(localStorage.getItem('mighty-3meseca-v3')) || JSON.parse(localStorage.getItem('mighty-3meseca-v2')) || JSON.parse(localStorage.getItem('mighty-3meseca')); } catch (e) {} S = { start: (old && old.start) || todayKey(), d: {} }; }
S.r = S.r || {}; // upisana ponavljanja: S.r[datum][vežba] = [serija1, serija2]
const repsOf = (k, i) => { const a = (S.r[k] || {})[i]; return Array.from({ length: exOf(k, i).sets }, (_, j) => Array.isArray(a) ? a[j] || '' : ''); };
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };
save();

const days = () => Array.from({ length: NDAYS }, (_, i) => addDays(S.start, i));
const last = () => addDays(S.start, NDAYS - 1);
const inRange = k => k >= S.start && k <= last();
const monthOf = k => Math.min(2, Math.floor(Math.max(0, days().indexOf(k)) / 30)); // 0, 1, 2
const exOf = (k, i) => { const e = planOf(k).ex[i], m = monthOf(k); return Object.assign({}, e, { name: e.n[m], tip: e.tm ? e.tm[m] : e.t }); };
const setsOf = (k, i) => {
  const a = (S.d[k] && S.d[k][i]) || [];
  return Array.from({ length: exOf(k, i).sets }, (_, j) => !!a[j]);
};
const exDone = (k, i) => setsOf(k, i).every(Boolean);
const dayDone = k => planOf(k).ex.every((_, i) => exDone(k, i));
const dayAny = k => planOf(k).ex.some((_, i) => setsOf(k, i).some(Boolean));
function setSets(k, i, arr) { (S.d[k] = S.d[k] || {})[i] = arr; save(); render(); }

let sel = inRange(todayKey()) ? todayKey() : S.start;
let tab = monthOf(sel);

// ===== Tajmer za džak =====
const T = { total: 0, left: 0, end: 0, run: false, k: null, i: null, iv: null };
const fmt = s => `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
function timerFor(k, i, min) {
  if (T.k !== k || T.i !== i) { if (T.run) return; Object.assign(T, { k, i, total: min * 60, left: min * 60 }); }
}
function tick() {
  if (!T.run) return;
  T.left = Math.max(0, Math.round((T.end - Date.now()) / 1000));
  if (T.left === 0) {
    T.run = false; clearInterval(T.iv);
    if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 400]);
    beep();
    setSets(T.k, T.i, [true]);
    return;
  }
  const el = document.getElementById('tVal'); if (el) el.textContent = fmt(T.left);
}
function beep() {
  try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(); o.connect(c.destination); o.frequency.value = 880; o.start(); o.stop(c.currentTime + 1); } catch (e) {}
}
function tStart() { if (T.run || T.left === 0) return; T.run = true; T.end = Date.now() + T.left * 1000; T.iv = setInterval(tick, 250); render(); }
function tPause() { if (!T.run) return; tick(); T.run = false; clearInterval(T.iv); render(); }
function tReset() { T.run = false; clearInterval(T.iv); T.left = T.total; render(); }

// ===== Statistika =====
function stats() {
  let exTot = 0, exOk = 0, dOk = 0, dTot = 0;
  const all = days();
  all.forEach(k => {
    const p = planOf(k); if (p.rest) return;
    dTot++;
    p.ex.forEach((_, i) => { exTot++; if (exDone(k, i)) exOk++; });
    if (dayDone(k)) dOk++;
  });
  // Niz: uzastopni završeni trening-dani unazad; subota (odmor) se preskače,
  // a današnji nezavršeni trening ne prekida niz.
  let streak = 0, k = todayKey() > last() ? last() : todayKey();
  if (!planOf(k).rest && !dayDone(k)) k = addDays(k, -1);
  while (k >= S.start) {
    if (!planOf(k).rest) { if (dayDone(k)) streak++; else break; }
    k = addDays(k, -1);
  }
  return { exOk, exTot, dOk, dTot, streak, pct: exTot ? Math.round(exOk / exTot * 100) : 0 };
}

// ===== Prikaz =====
const $ = id => document.getElementById(id);
function render() {
  const tk = todayKey(), tp = planOf(tk);
  let h = `<div class="muted">Danas · ${nice(tk)}</div>`;
  if (tk < S.start) h += `<h2>Program počinje ${nice(S.start)}</h2><p class="muted">Plan je spreman – vidimo se tada.</p>`;
  else if (tk > last()) h += `<h2>Program je završen 🏆</h2><p class="muted">Bravo! Izaberi novi datum početka u podešavanjima za novi krug.</p>`;
  else {
    h += `<h2>${tp.title}<span class="lvl">Mesec ${monthOf(tk) + 1}</span>${dayDone(tk) ? ' ✅' : ''}</h2>`;
    h += tp.rest ? `<div class="note">${tp.note}</div>` : `<div class="muted">${tp.ex.length > 1 ? (tp.ex.some(e => e.min) ? '~30 min (sa džakom)' : '~20 min') : '15 minuta'} · Dan ${days().indexOf(tk) + 1} od ${NDAYS}</div>`;
    h += `<button class="btn big" id="go">${tp.rest ? 'Pogledaj današnji plan' : 'Započni trening'}</button>`;
  }
  $('today').innerHTML = h;
  const go = $('go'); if (go) go.onclick = () => { sel = tk; tab = monthOf(tk); render(); $('daySec').scrollIntoView({ behavior: 'smooth' }); };

  const st = stats();
  $('pct').textContent = st.pct + '%'; $('barFill').style.width = st.pct + '%';
  $('stEx').textContent = `${st.exOk}/${st.exTot}`; $('stDays').textContent = `${st.dOk}/${st.dTot}`; $('stStreak').textContent = st.streak;

  // Izabrani dan
  const p = planOf(sel), idx = days().indexOf(sel), m = monthOf(sel);
  $('dayDate').textContent = `Dan ${idx + 1} · Mesec ${m + 1} · ${nice(sel)}`;
  $('dayTitle').textContent = p.title + (dayDone(sel) ? ' ✅' : '');
  $('dayNote').innerHTML = p.rest ? `<div class="note">${p.note}</div>` : p.ex.length > 1 ? `<div class="note">${DAY_NOTE}</div>` : '';
  $('prevDay').disabled = idx <= 0; $('nextDay').disabled = idx >= NDAYS - 1;
  $('exList').innerHTML = p.ex.map((_, i) => {
    const e = exOf(sel, i), s = setsOf(sel, i), ok = s.every(Boolean);
    const sub = p.rest ? '' : e.min ? `${e.min} minuta` : e.nf ? `2 serije · ${e.c} (ne do otkaza)` : `2 serije · cilj ${e.c} · 2. do otkaza`;
    let body = `<div class="exHead"><div class="nm">${e.l ? '<span class="lvl">' + e.l + '</span> ' : ''}${e.name}<small>${sub}</small></div><button class="chk ${ok ? 'on' : ''}" data-ex="${i}" aria-label="Označi vežbu">${ok ? '✓' : ''}</button></div>${pic(e.p)}<p class="tip">${e.tip}</p>`;
    if (e.sets > 1 && !p.rest) {
      const cur = repsOf(sel, i), prev = repsOf(addDays(sel, -7), i);
      body += `<div class="reps">${cur.map((v, j) => `<label>${j + 1}. serija<input type="number" inputmode="numeric" min="0" max="999" placeholder="${prev[j] || '–'}" data-rep="${i}" data-rs="${j}" value="${v || ''}"></label>`).join('')}<span class="muted">${prev.some(Boolean) ? 'Prošli put: <b class="lime">' + prev.map(v => v || '–').join(' / ') + '</b>' : 'Prvi put – upiši koliko si uradio'}</span></div>`;
    }
    if (e.sets > 1) body += `<div class="sets">${s.map((v, j) => `<button class="set ${v ? 'on' : ''}" data-ex="${i}" data-set="${j}">Serija ${j + 1}</button>`).join('')}</div>`;
    if (e.min) {
      timerFor(sel, i, e.min);
      body += T.k === sel && T.i === i
        ? `<div class="timer"><div class="t" id="tVal">${fmt(T.left)}</div><div class="row"><button class="btn" data-t="start">${T.left < T.total && !T.run ? 'Nastavi' : 'Start'}</button><button class="btn ghost" data-t="pause">Pauza</button><button class="btn ghost" data-t="reset">Reset</button></div></div>`
        : `<div class="timer muted">Tajmer je zauzet drugim danom – resetuj ga tamo.</div>`;
    }
    return `<div class="ex ${ok ? 'ok' : ''}">${body}</div>`;
  }).join('');
  $('markDay').textContent = p.rest ? 'Označi kao odmoreno' : 'Označi dan završenim';

  // Kartice meseci
  $('tabs').innerHTML = [0, 1, 2].map(t => `<button class="${t === tab ? 'on' : ''}" data-tab="${t}">Mesec ${t + 1}</button>`).join('');

  // Kalendar izabranog meseca (30 dana)
  const block = days().slice(tab * 30, tab * 30 + 30);
  let c = '', lastMonth = -1;
  block.forEach(k => {
    const d = parse(k);
    if (d.getMonth() !== lastMonth) {
      lastMonth = d.getMonth();
      c += `<div class="mon">${MESECI[lastMonth]} ${d.getFullYear()}</div>` + ['Pon', 'Uto', 'Sre', 'Čet', 'Pet', 'Sub', 'Ned'].map(w => `<div class="wd">${w}</div>`).join('');
      c += '<div></div>'.repeat((d.getDay() + 6) % 7);
    }
    const pl = planOf(k);
    const short = { 'Gornji deo A': 'gornji', 'Gornji deo B': 'gornji', 'Donji deo A + džak': 'noge', 'Donji deo B + džak': 'noge', 'Odmor': 'odmor' }[pl.title];
    const cls = ['d', pl.rest ? 'rest' : '', dayDone(k) && !pl.rest ? 'done' : (dayAny(k) ? 'part' : ''), k === tk ? 'today' : '', k === sel ? 'sel' : ''].join(' ');
    c += `<button class="${cls}" data-day="${k}">${d.getDate()}<small>${short}</small></button>`;
  });
  $('cal').innerHTML = c;
  $('startDate').value = S.start;
}

// ===== Događaji =====
document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.tab) { tab = +b.dataset.tab; render(); return; }
  if (b.dataset.day) { sel = b.dataset.day; render(); $('daySec').scrollIntoView({ behavior: 'smooth' }); return; }
  if (b.dataset.t) { ({ start: tStart, pause: tPause, reset: tReset })[b.dataset.t](); return; }
  if (b.dataset.ex !== undefined) {
    const i = +b.dataset.ex, s = setsOf(sel, i);
    if (b.dataset.set !== undefined) { s[+b.dataset.set] = !s[+b.dataset.set]; setSets(sel, i, s); }
    else { const all = s.every(Boolean); setSets(sel, i, s.map(() => !all)); }
  }
});
const go = n => { const i = days().indexOf(sel) + n; if (i >= 0 && i < NDAYS) { sel = days()[i]; tab = monthOf(sel); render(); } };
$('prevDay').onclick = () => go(-1);
$('nextDay').onclick = () => go(1);
$('markDay').onclick = () => { S.d[sel] = {}; planOf(sel).ex.forEach((_, i) => S.d[sel][i] = Array(exOf(sel, i).sets).fill(true)); save(); render(); };
$('resetDay').onclick = () => { delete S.d[sel]; delete S.r[sel]; save(); render(); };
$('startDate').onchange = e => {
  if (!e.target.value) return;
  if (Object.keys(S.d).length && !confirm('Promena datuma početka pomera kalendar. Napredak po datumima ostaje sačuvan. Nastaviti?')) { render(); return; }
  S.start = e.target.value; save(); sel = inRange(todayKey()) ? todayKey() : S.start; tab = monthOf(sel); tReset(); render();
};
$('resetAll').onclick = () => {
  if (!confirm('Da li sigurno želiš da obrišeš SAV napredak? Ovo se ne može vratiti.')) return;
  S.d = {}; S.r = {}; save(); tReset(); render();
};
document.addEventListener('change', ev => {
  const t = ev.target; if (!t.dataset || t.dataset.rep === undefined) return;
  const i = +t.dataset.rep, j = +t.dataset.rs, v = t.value.trim();
  const r = repsOf(sel, i); r[j] = v;
  (S.r[sel] = S.r[sel] || {})[i] = r;
  const s = setsOf(sel, i); if (v) s[j] = true; // upisan broj = serija urađena
  setSets(sel, i, s);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); render(); } });

render();
